[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"                # Simple public endpoint (no auth, no DB)
healthcheckTimeout = 120                   # Seconds to wait for a response
healthcheckInterval = 10                   # Seconds between checks
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10