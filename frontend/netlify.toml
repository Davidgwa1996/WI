[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "${BACKEND_URL}/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws"
  to = "${BACKEND_URL}/ws"
  status = 200
  force = true
  headers = {Connection = "upgrade", Upgrade = "websocket"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200