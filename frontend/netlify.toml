[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests to Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://wi-production-ae1c.up.railway.app/:splat"
  status = 200
  force = true

# Proxy WebSocket requests to Railway backend
[[redirects]]
  from = "/ws"
  to = "https://wi-production-ae1c.up.railway.app/ws"
  status = 200
  force = true
  headers = {Connection = "upgrade", Upgrade = "websocket"}

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200